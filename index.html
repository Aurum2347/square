<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Square</title>
<style>
@font-face{font-family:'SquareFont';src:url('minecraft.ttf') format('truetype');font-weight:normal;font-style:normal;font-display:swap;}
:root{--cy:#7ee7ff;--vi:#c77dff;--go:#ffce44;--re:#ff4a5a;--mi:#6dffc0;--or:#ff9f45;--bg:#04050a;--mu:#5b6190;--mu2:#333a5c;--wh:#eef2ff;
--fm:'SquareFont',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
--fd:'SquareFont',ui-monospace,Menlo,Consolas,monospace;}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--wh);font-family:var(--fm);-webkit-tap-highlight-color:transparent;user-select:none;-webkit-font-smoothing:antialiased}
canvas#game{display:block;position:fixed;inset:0;z-index:1;transition:filter .18s linear}
canvas#game.mono{filter:grayscale(.75) contrast(1.22) brightness(.86) saturate(.7)}
canvas#game.monoF{filter:grayscale(.92) contrast(1.55) brightness(1.12)}
canvas#game.glitch{animation:gl .32s steps(2) 3}
@keyframes gl{0%{transform:translate(0)}25%{transform:translate(-6px,3px)}50%{transform:translate(5px,-4px)}75%{transform:translate(-3px,-2px)}100%{transform:translate(0)}}
#ui{position:fixed;inset:0;pointer-events:none;z-index:5;font-size:11px}
.pnl{background:linear-gradient(155deg,rgba(18,23,42,.8),rgba(7,9,18,.84));border:1px solid rgba(126,231,255,.16);border-radius:13px;position:relative;backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);box-shadow:0 10px 34px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.05)}
.pnl::before,.pnl::after{content:'';position:absolute;width:8px;height:8px;border:1px solid rgba(126,231,255,.42);pointer-events:none}
.pnl::before{top:-1px;left:-1px;border-right:0;border-bottom:0;border-radius:13px 0 0 0}
.pnl::after{bottom:-1px;right:-1px;border-left:0;border-top:0;border-radius:0 0 13px 0}
.lbl{font-size:8px;letter-spacing:.32em;color:var(--mu);text-transform:uppercase}
.tl{position:absolute;top:14px;left:14px;padding:11px 15px 10px;min-width:230px;display:flex;flex-direction:column;gap:8px}
.tlTop{display:flex;align-items:baseline;gap:8px}
.lvN{font-family:var(--fd);font-size:21px;font-weight:700;color:#fff;line-height:1;text-shadow:0 0 16px rgba(126,231,255,.7)}
.lvO{font-size:9px;letter-spacing:.18em;color:var(--mu2)}
.lvNm{margin-left:auto;font-size:9px;letter-spacing:.26em;color:var(--vi);text-transform:uppercase;text-shadow:0 0 12px rgba(199,125,255,.5)}
.tlS{display:flex;gap:13px;align-items:center}
.sb{display:flex;align-items:center;gap:5px;font-size:12px;letter-spacing:.08em}
.sb .g{font-size:12px;filter:drop-shadow(0 0 6px currentColor)}
.cGo{color:var(--go)}.cCy{color:var(--cy)}
.hp{display:flex;gap:4px;margin-left:auto}
.hp i{width:10px;height:14px;border-radius:3px;background:linear-gradient(180deg,#ff7b86,#e0243a);box-shadow:0 0 10px rgba(255,74,90,.85),inset 0 1px 0 rgba(255,255,255,.4);transition:.3s cubic-bezier(.2,1.4,.4,1)}
.hp i.off{background:#1b1e2e;box-shadow:none;transform:scaleY(.4);opacity:.5}
.hp i.sh{background:linear-gradient(180deg,#c9fff0,#2fd6a0);box-shadow:0 0 12px rgba(109,255,192,.9);animation:shp 1.4s ease-in-out infinite}
@keyframes shp{0%,100%{opacity:1}50%{opacity:.55}}
.obj{font-size:8.5px;letter-spacing:.13em;color:var(--mu);text-transform:uppercase;border-top:1px solid rgba(126,231,255,.09);padding-top:7px;line-height:1.65}
.obj b{color:var(--cy);font-weight:400}
.elem{display:flex;align-items:center;gap:6px;font-size:9px;letter-spacing:.18em}
.elem i{width:9px;height:9px;border-radius:2px;transform:rotate(45deg);box-shadow:0 0 10px currentColor;background:currentColor}
.tr{position:absolute;top:14px;right:14px;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.scb{padding:8px 15px 9px;text-align:right;min-width:152px}
.sc{font-family:var(--fd);font-size:22px;font-weight:700;color:#fff;line-height:1.1;text-shadow:0 0 20px rgba(126,231,255,.6)}
.cmb{font-size:9px;letter-spacing:.2em;color:var(--go);height:11px;text-shadow:0 0 10px rgba(255,206,68,.8);opacity:0;transition:.2s}
.cmb.on{opacity:1}
.bbx{padding:8px 13px 10px;width:264px;opacity:0;transform:translateY(-8px) scale(.97);transition:.4s cubic-bezier(.2,1,.3,1);pointer-events:none}
.bbx.on{opacity:1;transform:none}
.bh{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.bn{font-family:var(--fd);font-size:11px;font-weight:700;letter-spacing:.22em;color:#fff;text-shadow:0 0 14px rgba(199,125,255,.85)}
.bt{font-size:7.5px;letter-spacing:.18em;color:var(--mu);margin-left:auto}
.pips{display:flex;gap:3px}
.pips i{width:13px;height:3px;border-radius:2px;background:#2b2f47;transition:.3s}
.pips i.on{background:var(--vi);box-shadow:0 0 8px rgba(199,125,255,.9)}
.bbar{height:8px;border-radius:5px;background:rgba(6,8,16,.85);overflow:hidden;border:1px solid rgba(199,125,255,.24);position:relative}
.bbar>i{display:block;height:100%;width:100%;border-radius:4px;background:linear-gradient(90deg,#ff2d55,#ff6b9d 40%,#c77dff);box-shadow:0 0 12px rgba(255,74,90,.7);transition:width .2s}
.bbar::after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 9px,rgba(0,0,0,.35) 9px 10px)}
.meters{position:absolute;top:14px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;width:min(340px,60vw)}
.mtr{width:100%;opacity:0;transform:translateY(-8px);transition:.28s}
.mtr.on{opacity:1;transform:none}
.mtrL{display:flex;justify-content:space-between;font-size:8px;letter-spacing:.24em;color:var(--mu);margin-bottom:3px;text-transform:uppercase}
.mtrB{height:7px;border-radius:4px;background:rgba(8,10,20,.8);overflow:hidden;border:1px solid rgba(255,255,255,.12)}
.mtrB>i{display:block;height:100%;border-radius:3px;transition:width .07s linear}
.mtrSlow .mtrB>i{background:linear-gradient(90deg,#c77dff,#e9c9ff);box-shadow:0 0 12px rgba(199,125,255,.8)}
.mtrSlow.over .mtrB>i{background:linear-gradient(90deg,#ff4a5a,#ff8a7a);box-shadow:0 0 14px rgba(255,74,90,.9);animation:ovp .45s ease-in-out infinite}
@keyframes ovp{0%,100%{opacity:1}50%{opacity:.45}}
.mtrTs .mtrB>i{background:linear-gradient(90deg,#fff,#7ee7ff);box-shadow:0 0 14px rgba(255,255,255,.9)}
.mtrTs .mtrL{color:#fff;text-shadow:0 0 12px rgba(126,231,255,.9)}
.dock{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);display:flex;gap:6px;pointer-events:auto}
.ab{width:54px;height:58px;border-radius:12px;position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:5px;gap:2px;cursor:pointer;background:linear-gradient(165deg,rgba(24,30,54,.82),rgba(8,10,20,.9));border:1px solid rgba(126,231,255,.13);transition:transform .18s cubic-bezier(.2,1.6,.4,1),border-color .2s,box-shadow .25s,opacity .3s}
.ab .ic{width:19px;height:19px;margin-bottom:1px;opacity:.8;transition:.25s}
.ab .ic svg{width:100%;height:100%;display:block}
.ab .k{position:absolute;top:4px;left:5px;font-size:7.5px;font-weight:700;color:var(--mu);background:rgba(0,0,0,.42);border-radius:4px;padding:1px 4px;border:1px solid rgba(255,255,255,.07)}
.ab .n{font-size:6.5px;letter-spacing:.12em;color:var(--mu);text-transform:uppercase}
.ab .cdm{position:absolute;inset:0;pointer-events:none;background:conic-gradient(from 0deg,rgba(3,4,10,.86) var(--cd,0deg),transparent 0)}
.ab .nbr{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.08)}
.ab .nbr>i{display:block;height:100%;width:100%;background:var(--acc);box-shadow:0 0 8px var(--acc)}
.ab.rdy{border-color:color-mix(in srgb,var(--acc) 55%,transparent);box-shadow:0 0 16px color-mix(in srgb,var(--acc) 24%,transparent),inset 0 0 20px color-mix(in srgb,var(--acc) 8%,transparent)}
.ab.rdy .ic{opacity:1;filter:drop-shadow(0 0 6px var(--acc))}
.ab.rdy .n{color:#c9d2f0}
.ab.lk{opacity:.18;filter:grayscale(1)}
.ab.lk .k,.ab.lk .n{display:none}
.ab .lkI{position:absolute;inset:0;display:none;align-items:center;justify-content:center;font-size:12px;color:var(--mu2)}
.ab.lk .lkI{display:flex}.ab.lk .ic{opacity:0}
.ab.act{transform:scale(.92)}
.ab.fl{animation:abf .42s cubic-bezier(.2,1.5,.4,1)}
@keyframes abf{0%{transform:scale(1)}30%{transform:scale(1.16);box-shadow:0 0 30px var(--acc)}100%{transform:scale(1)}}
#toasts{position:absolute;top:120px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;width:min(560px,88vw)}
.tst{padding:8px 18px;border-radius:11px;text-align:center;background:linear-gradient(150deg,rgba(20,26,48,.92),rgba(8,10,20,.92));border:1px solid rgba(126,231,255,.22);box-shadow:0 8px 30px rgba(0,0,0,.6);backdrop-filter:blur(10px);animation:tin .45s cubic-bezier(.16,1,.3,1) both;max-width:100%}
.tst.out{animation:tout .4s ease forwards}
.tst .t{font-size:10.5px;letter-spacing:.17em;text-transform:uppercase;color:#fff}
.tst .s{font-size:8.5px;letter-spacing:.1em;color:var(--mu);margin-top:3px;line-height:1.5}
@keyframes tin{from{opacity:0;transform:translateY(-14px) scale(.94)}to{opacity:1;transform:none}}
@keyframes tout{to{opacity:0;transform:translateY(-8px) scale(.97)}}
#ban{position:absolute;top:31%;left:0;right:0;text-align:center;pointer-events:none;opacity:0}
#ban.go{animation:bn 2.7s cubic-bezier(.16,1,.3,1) both}
#ban .b1{font-size:9px;letter-spacing:.58em;color:var(--mu);text-transform:uppercase;padding-left:.58em}
#ban .b2{font-family:var(--fd);font-size:clamp(24px,5.6vw,50px);font-weight:700;letter-spacing:.14em;color:#fff;margin-top:5px;padding-left:.14em;text-shadow:0 0 36px rgba(126,231,255,.9),0 0 80px rgba(199,125,255,.6)}
#ban .b3{font-size:9.5px;letter-spacing:.32em;color:var(--vi);margin-top:8px;padding-left:.32em;text-transform:uppercase}
@keyframes bn{0%{opacity:0;transform:scale(1.13) translateY(10px);filter:blur(9px)}16%{opacity:1;transform:none;filter:blur(0)}72%{opacity:1}100%{opacity:0;transform:scale(.97)}}
#ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:9;pointer-events:none;opacity:0;transition:opacity .42s;padding:18px}
#ov.on{opacity:1;pointer-events:auto}
#ov::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(4,5,10,.55),rgba(4,5,10,.9))}
.card{text-align:center;padding:30px 42px;border-radius:22px;max-width:min(720px,94vw);max-height:92vh;overflow-y:auto;position:relative;background:radial-gradient(ellipse at 50% 0%,rgba(28,34,64,.92),rgba(5,6,13,.6) 70%);border:1px solid rgba(126,231,255,.16);box-shadow:0 26px 80px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.07);animation:cin .6s cubic-bezier(.16,1,.3,1) both;scrollbar-width:thin}
.card::-webkit-scrollbar{width:6px}.card::-webkit-scrollbar-thumb{background:rgba(126,231,255,.3);border-radius:3px}
@keyframes cin{from{transform:scale(.94) translateY(12px);opacity:0}to{transform:none;opacity:1}}
.card h1{font-family:var(--fd);font-size:clamp(22px,5vw,36px);letter-spacing:.42em;font-weight:700;text-transform:uppercase;padding-left:.42em;color:#fff;text-shadow:0 0 30px rgba(126,231,255,.95),0 0 70px rgba(199,125,255,.6)}
.card h1 .ac{color:var(--cy)}
.card h2{font-family:var(--fd);font-size:clamp(14px,3vw,20px);letter-spacing:.36em;font-weight:700;text-transform:uppercase;padding-left:.36em;color:var(--vi);text-shadow:0 0 26px rgba(199,125,255,.9)}
.card h2.win{color:#fff;background:linear-gradient(92deg,#ffce44,#fff3c4,#7ee7ff,#c77dff,#ffce44);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:shn 5s linear infinite}
@keyframes shn{to{background-position:300% 0}}
.card p,.card .sub{margin-top:12px;font-size:9.5px;letter-spacing:.24em;color:var(--mu);text-transform:uppercase;line-height:2}
.al{width:64px;height:1px;margin:16px auto;background:linear-gradient(90deg,transparent,var(--cy),transparent);opacity:.7}
.stats{display:flex;gap:28px;justify-content:center;margin-top:18px;flex-wrap:wrap}
.stat{display:flex;flex-direction:column;gap:6px}
.stat b{font-family:var(--fd);font-size:23px;font-weight:700;color:#fff;text-shadow:0 0 20px rgba(126,231,255,.6)}
.stat span{font-size:7.5px;letter-spacing:.28em;color:var(--mu);text-transform:uppercase}
.keys{margin-top:18px;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:6px 18px;text-align:left;font-size:9.5px;letter-spacing:.08em;color:var(--mu)}
.keys div{display:flex;align-items:center;gap:8px}
.keys kbd{color:var(--cy);letter-spacing:.08em;font-family:inherit;font-size:8.5px;min-width:46px;text-align:center;padding:3px 6px;border-radius:5px;background:rgba(126,231,255,.08);border:1px solid rgba(126,231,255,.2)}
.key{margin-top:20px;font-size:9.5px;letter-spacing:.32em;color:var(--cy);text-transform:uppercase;animation:pu 2.1s ease-in-out infinite;padding-left:.32em}
@keyframes pu{0%,100%{opacity:.42}50%{opacity:1}}
.btn{margin-top:16px;display:inline-block;padding:11px 30px;border-radius:11px;cursor:pointer;font-family:inherit;font-size:9.5px;letter-spacing:.26em;text-transform:uppercase;color:#04050a;background:linear-gradient(120deg,var(--cy),#b9f3ff);font-weight:700;border:0;box-shadow:0 0 26px rgba(126,231,255,.45);transition:.2s cubic-bezier(.2,1.4,.4,1)}
.btn:hover{transform:translateY(-2px) scale(1.04);box-shadow:0 0 40px rgba(126,231,255,.75)}
.btn.gh{background:transparent;color:var(--mu);border:1px solid rgba(126,231,255,.24);box-shadow:none;margin-left:8px}
.btn.gh:hover{color:var(--cy);border-color:var(--cy)}
.btn.sm{padding:8px 18px;font-size:8.5px;letter-spacing:.2em}
.menu{display:flex;flex-direction:column;gap:8px;margin-top:18px;min-width:min(340px,80vw)}
.mi{padding:12px 20px;border-radius:11px;cursor:pointer;text-align:left;display:flex;align-items:center;gap:12px;background:linear-gradient(120deg,rgba(24,30,54,.7),rgba(10,12,24,.7));border:1px solid rgba(126,231,255,.14);transition:.22s cubic-bezier(.2,1.3,.4,1);font-family:inherit;color:var(--wh);font-size:10px;letter-spacing:.24em;text-transform:uppercase}
.mi:hover{border-color:rgba(126,231,255,.55);transform:translateX(6px);box-shadow:0 0 24px rgba(126,231,255,.2)}
.mi .mi-i{font-size:14px;width:20px;text-align:center;filter:drop-shadow(0 0 8px currentColor)}
.mi .mi-s{margin-left:auto;font-size:8px;letter-spacing:.14em;color:var(--mu2);text-transform:none}
.mi.dis{opacity:.32;pointer-events:none;filter:grayscale(1)}
.achs{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin-top:16px}
.ach{padding:6px 12px;border-radius:18px;font-size:8.5px;letter-spacing:.12em;text-transform:uppercase;border:1px solid rgba(90,100,150,.3);color:var(--mu2);background:rgba(20,24,44,.5);transition:.3s;animation:ain .5s cubic-bezier(.16,1,.3,1) both}
.ach.got{border-color:rgba(255,206,68,.4);color:var(--go);background:rgba(255,206,68,.08);box-shadow:0 0 16px rgba(255,206,68,.16)}
@keyframes ain{from{opacity:0;transform:translateY(9px) scale(.92)}to{opacity:1;transform:none}}
.rank{font-family:var(--fd);font-size:68px;font-weight:700;line-height:1;margin:4px 0 2px;background:linear-gradient(160deg,#fff,#ffce44 45%,#ff8a3d);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 30px rgba(255,206,68,.85));animation:rin 1.1s cubic-bezier(.16,1.4,.3,1) both}
@keyframes rin{from{transform:scale(2.3) rotate(-13deg);opacity:0;filter:blur(13px)}to{transform:none;opacity:1}}
.setg{display:flex;flex-direction:column;gap:13px;margin-top:16px;text-align:left;min-width:min(400px,86vw)}
.srow{display:flex;align-items:center;gap:12px;font-size:9.5px;letter-spacing:.16em;color:var(--mu);text-transform:uppercase}
.srow>span:first-child{min-width:120px}
.srow .val{margin-left:auto;color:var(--cy);letter-spacing:.12em;min-width:34px;text-align:right}
.seg{display:flex;gap:3px;margin-left:auto}
.seg button{width:26px;height:22px;border-radius:5px;border:1px solid rgba(126,231,255,.2);background:rgba(10,14,28,.7);color:var(--mu);font-family:inherit;font-size:8.5px;cursor:pointer;transition:.2s}
.seg button.on{background:rgba(126,231,255,.2);color:#fff;border-color:var(--cy);box-shadow:0 0 12px rgba(126,231,255,.35)}
.tg{width:44px;height:22px;border-radius:12px;border:1px solid rgba(126,231,255,.24);background:rgba(10,14,28,.8);position:relative;cursor:pointer;margin-left:auto;transition:.25s;flex:none}
.tg::after{content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--mu2);transition:.25s cubic-bezier(.2,1.4,.4,1)}
.tg.on{background:rgba(126,231,255,.2);border-color:var(--cy)}
.tg.on::after{left:24px;background:var(--cy);box-shadow:0 0 12px var(--cy)}
input[type=range]{-webkit-appearance:none;appearance:none;width:120px;height:4px;border-radius:3px;background:rgba(126,231,255,.2);outline:none;margin-left:auto}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--cy);cursor:pointer;box-shadow:0 0 10px var(--cy)}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--cy);cursor:pointer;border:0}
.demo{width:min(320px,84vw);height:160px;border-radius:12px;background:radial-gradient(ellipse at center,#0c1120,#05060d);border:1px solid rgba(126,231,255,.2);margin:14px auto 4px;display:block;box-shadow:inset 0 0 40px rgba(0,0,0,.7)}
.abGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:9px;margin-top:14px}
.abC{padding:11px;border-radius:11px;background:rgba(16,20,38,.7);border:1px solid rgba(126,231,255,.14);cursor:pointer;transition:.22s;text-align:left}
.abC:hover{border-color:var(--cy);transform:translateY(-3px);box-shadow:0 8px 24px rgba(126,231,255,.18)}
.abC .h{display:flex;align-items:center;gap:7px;font-size:9.5px;letter-spacing:.16em;color:#fff;text-transform:uppercase}
.abC .h svg{width:16px;height:16px}
.abC .d{font-size:8.5px;letter-spacing:.06em;color:var(--mu);margin-top:6px;line-height:1.6;text-transform:none}
.abC .u{font-size:7.5px;letter-spacing:.16em;color:var(--mu2);margin-top:5px}
#cf{position:fixed;inset:0;pointer-events:none;z-index:8;overflow:hidden;display:none}
#cf.on{display:block}
#cf i{position:absolute;top:-30px;width:8px;height:8px;border-radius:2px;animation:fll linear infinite}
@keyframes fll{to{transform:translateY(112vh) rotate(760deg)}}
#fps{position:absolute;bottom:14px;right:14px;font-size:8px;letter-spacing:.16em;color:var(--mu2);opacity:0;transition:.3s}
#fps.on{opacity:1}
@media(max-width:780px){.tl{min-width:0;padding:8px 11px;gap:5px;top:9px;left:9px}.lvN{font-size:16px}.scb{min-width:0;padding:6px 11px}.sc{font-size:17px}.bbx{width:186px}.obj{display:none}.ab{width:44px;height:50px}.ab .n{display:none}.card{padding:22px 18px}.meters{width:min(240px,70vw);top:96px}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="ui">
<div class="tl pnl" id="tlP">
<div class="tlTop"><span class="lvN" id="lvN">01</span><span class="lvO">/ 25</span><span class="lvNm" id="lvNm">ЗАБВЕНИЕ</span></div>
<div class="tlS"><div class="sb cGo"><span class="g">◆</span><span id="cns">0/5</span></div><div class="sb cCy"><span class="g">⧗</span><span id="tm">0:00</span></div><div class="hp" id="hpw"></div></div>
<div class="elem" id="elemW"><i style="color:#ff9f45"></i><span>ПЛАМЯ</span></div>
<div class="obj" id="objw">ЦЕЛЬ: <b>СОБЕРИ ВСЕ ◆</b></div>
</div>
